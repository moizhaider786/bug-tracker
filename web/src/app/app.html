<div class="app-layout">
  @if (authService.isAuthenticated() && sidebarService.get()) {
    <header class="top-bar">
      <app-notification-bell></app-notification-bell>
    </header>
    <app-sidebar></app-sidebar>
  }
  <main
    class="main-content"
    [class.with-sidebar]="authService.isAuthenticated() && sidebarService.get()"
  >
    <router-outlet />
  </main>
</div>
