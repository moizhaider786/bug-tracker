<div class="notification-container">
  <button class="bell-button" (click)="toggleDropdown()">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    @if (unreadCount > 0) {
      <span class="badge">{{ unreadCount }}</span>
    }
  </button>
  @if (isDropdownOpen) {
    <div class="dropdown-menu">
      <div class="dropdown-header">
        <h4>Notifications</h4>
      </div>
      <div class="dropdown-body">
        @if (notifications.length === 0) {
          <div class="empty-state">No new notifications.</div>
        }
        @for (notif of notifications; track $index) {
          <div class="notification-item">
            <div class="notif-title">{{ notif.title }}</div>
            @if (notif.description) {
              <div class="notif-desc">{{ notif.description }}</div>
            }
            <div class="notif-time">{{ notif.createdAt | date: 'short' }}</div>
          </div>
        }
      </div>
    </div>
  }
</div>
