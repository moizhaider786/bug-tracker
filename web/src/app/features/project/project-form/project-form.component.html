@if (isAuthorized()) {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="project-form">
    <div class="form-group">
      <label for="name">Project Name:</label>
      <input
        class="form-input"
        type="text"
        id="name"
        formControlName="name"
      />
      @if (form.controls['name'].invalid && form.controls['name'].touched) {
        <div class="error">Project name is required.</div>
      }
    </div>

    <div class="form-group">
      <label for="description">Description:</label>
      <textarea
        class="form-input"
        id="description"
        formControlName="description"
        rows="4"
      ></textarea>
    </div>

    <div class="form-actions">
      <button class="btn-primary" type="submit" [disabled]="form.invalid || form.disabled">
        {{ isEditForm() ? 'Update Project' : 'Create Project' }}
      </button>
    </div>
  </form>
}
