<form (ngSubmit)="onSubmit()">
  <label for="name">Project Name:</label>
  <input
    type="text"
    id="name"
    name="name"
    required
    [(ngModel)]="projectFormData.name"
    #name="ngModel"
  />
  @if (name.invalid && (name.touched || name.dirty)) {
    <div class="error">Project name is required.</div>
  }
  <label for="description">Description:</label>
  <textarea
    id="description"
    name="description"
    [(ngModel)]="projectFormData.description"
  ></textarea>
  <button type="submit">
    {{ isEditForm() ? 'Update Project' : 'Create Project' }}
  </button>
</form>
