<h1>Projects</h1>
<button (click)="openProjectForm(false)">Create Project</button>
@if (isProjectFormVisible()) {
  <div class="prjform-modal">
    <button (click)="closeProjectForm()">Close</button>
    <app-project-form
      [isEditForm]="isEditProjectForm()"
      [editProjectId]="editProjectId()"
    ></app-project-form>
  </div>
}

<div class="prjlist-container">
  <app-project-list (editProject)="editProject($event)"></app-project-list>
</div>
