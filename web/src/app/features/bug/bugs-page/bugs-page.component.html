<div class="bugs-page-container">
  <div class="header-section">
    <h1>All Bugs</h1>
    <div class="filter-group">
      <label for="projectFilter">Filter by Project:</label>
      <select id="projectFilter" [(ngModel)]="selectedProjectId">
        <option [value]="null">All Projects</option>
        @for (project of projectsWithBugs(); track project.id) {
          <option [value]="project.id">{{ project.name }}</option>
        }
      </select>
    </div>
  </div>

  <div class="projects-list">
    @for (group of groupedBugs(); track group.projectId) {
      <details class="project-bugs-collapsible" open>
        <summary class="project-summary">
          <h2>{{ group.projectName }}</h2>
        </summary>
        <div class="bugs-wrapper">
          <app-bug-list
            [preloadedBugs]="group.bugs"
            [projectId]="group.projectId"
          ></app-bug-list>
        </div>
      </details>
    } @empty {
      <p class="empty-state">No bugs found.</p>
    }
  </div>
</div>
